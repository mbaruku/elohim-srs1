
<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>Waalimu Wote</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}">
</head>
<body>
<div class="container mt-4">
    <h2>👨‍🏫 Orodha ya Waalimu</h2>

    <table class="table table-striped">
        <thead>
          <tr>
            <th>Jina</th>
            <th>Darasa</th>
            <th>Hatua</th>
          </tr>
        </thead>
        <tbody>
          {% for teacher in teachers %}
          <tr>
            <td>{{ teacher.username }}</td>
            <td>{{ teacher.class_level or 'Hakuna' }}</td>
            <td>
              <a href="{{ url_for('edit_user', id=teacher.id) }}" class="btn btn-warning btn-sm">Edit</a>
              <form method="POST" action="/admin/delete-user" style="display:inline;">
                <input type="hidden" name="username" value="{{ teacher.username }}">
                <button type="submit" class="btn btn-danger btn-sm">Futa</button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      
    <a href="/admin" class="btn btn-secondary">🔙 Rudi Dashboard</a>
</div>
</body>
</html>
