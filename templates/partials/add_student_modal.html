<!-- Add Student Modal -->
<div class="modal fade" id="addStudentModal" tabindex="-1" aria-hidden="true" aria-labelledby="addStudentModalLabel">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="POST" action="/admin/add-student" id="addStudentForm">
        <div class="modal-header">
          <h5 class="modal-title">➕ Ongeza Mwanafunzi</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <!-- Username -->
          <label>Jina la mtumiaji</label>
          <input type="text" id="studentUsername" name="username"
                 class="form-control"
                 placeholder="Mfano: Juma Ali Said"
                 required>

          <small class="text-muted">
            Andika majina matatu. Jina la tatu litakuwa password.
          </small>

          <!-- Auto Password -->
          <label class="mt-2">Password (auto generated)</label>
          <input type="text" id="studentPassword"
                 name="password"
                 class="form-control"
                 readonly>

          <!-- Class -->
          <label class="mt-2">Darasa</label>
          <select id="studentClass"
                  name="class_level"
                  class="form-select"
                  required>

            <option value="">-- Chagua Darasa --</option>
            <option value="Form One">Form One</option>
            <option value="Form Two">Form Two</option>
            <option value="Form Three">Form Three</option>
            <option value="Form Four">Form Four</option>

          </select>

          <!-- Combination -->
          <label class="mt-2">Combination</label>
          <select id="studentCombination"
                  name="combination"
                  class="form-select">

            <option value="">-- Chagua Combination --</option>
            <option value="Arts">Arts</option>
            <option value="Science">Science</option>

          </select>

          <!-- Subjects -->
          <div class="mt-3">

            <label>Masomo</label>

            <select id="studentSubjects"
                    name="subjects[]"
                    class="form-select"
                    multiple>

            </select>

            <small class="text-muted">
              Masomo yataonekana kulingana na darasa na combination
            </small>

          </div>

        </div>

        <div class="modal-footer">

          <button type="submit"
                  class="btn btn-success">

            ➕ Ongeza

          </button>

        </div>

      </form>
    </div>
  </div>
</div>

<script>

document.addEventListener("DOMContentLoaded", function(){

  const usernameInput = document.getElementById("studentUsername");
  const passwordInput = document.getElementById("studentPassword");
  const classSelect = document.getElementById("studentClass");
  const comboSelect = document.getElementById("studentCombination");
  const subjectsSelect = document.getElementById("studentSubjects");

  // Auto password kutoka jina la tatu
  usernameInput.addEventListener("blur", function(){

    const names = usernameInput.value.trim().split(" ");

    if(names.length === 3){
      passwordInput.value = names[2];
    }else{
      passwordInput.value = "";
    }

  });

  // Fetch subjects kutoka database
  function updateSubjects(){

    const cls = classSelect.value;
    const combo = comboSelect.value;

    if(!cls){
      subjectsSelect.innerHTML = "";
      return;
    }

    fetch(`/admin/get-subjects?class_level=${cls}&combination=${combo}`)

    .then(res => res.json())

    .then(data => {

      subjectsSelect.innerHTML = "";

      data.subjects.forEach(function(subject){

        const option = document.createElement("option");

        option.value = subject;
        option.text = subject;

        subjectsSelect.appendChild(option);

      });

    });

  }

  classSelect.addEventListener("change", updateSubjects);
  comboSelect.addEventListener("change", updateSubjects);

  // Validation
  document.getElementById("addStudentForm").addEventListener("submit", function(e){

    const names = usernameInput.value.trim().split(" ");

    if(names.length !== 3){

      e.preventDefault();

      alert("Username lazima iwe na majina matatu. Mfano: Juma Ali Said");

      return;

    }

    if(!classSelect.value){

      e.preventDefault();

      alert("Chagua darasa");

      return;

    }

    if((classSelect.value === "Form Three" || classSelect.value === "Form Four") && !comboSelect.value){

      e.preventDefault();

      alert("Chagua combination (Arts/Science) kwa Form 3 na 4");

    }

  });

});

</script>
