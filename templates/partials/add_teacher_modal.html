<!-- Modal: Ongeza Mwalimu -->
<div class="modal fade" id="addTeacherModal" tabindex="-1">
<div class="modal-dialog modal-lg">

<form action="/admin/add-teacher" method="POST" id="addTeacherForm">

<div class="modal-content">

<div class="modal-header">
<h5 class="modal-title">➕ Ongeza Mwalimu</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">

<!-- Username -->
<div class="mb-3">
<label class="form-label">Jina la Mtumiaji</label>

<input type="text"
class="form-control"
name="username"
id="teacherUsername"
placeholder="Mfano: Juma Ali Said"
required>

<small class="text-muted">
Andika majina matatu. Jina la tatu litakuwa password.
</small>

</div>

<!-- Class teacher -->
<div class="mb-3">

<label class="form-label">Darasa (ikiwa ni mwalimu wa darasa)</label>

<select class="form-control" name="class_level">

<option value="">-- Chagua Darasa --</option>
<option value="Form One">Form One</option>
<option value="Form Two">Form Two</option>
<option value="Form Three">Form Three</option>
<option value="Form Four">Form Four</option>

</select>

</div>

<div class="form-check mb-4">

<input class="form-check-input"
type="checkbox"
name="is_class_teacher">

<label class="form-check-label">
Mwalimu wa Darasa
</label>

</div>

<!-- SUBJECT + CLASS TABLE -->

<label class="form-label">Masomo na Madarasa Anayofundisha</label>

<table class="table table-bordered" id="subjectTable">

<thead class="table-light">

<tr>

<th>Somo</th>
<th>Darasa</th>
<th width="80">Action</th>

</tr>

</thead>

<tbody>

<tr>

<td>

<select class="form-control subject-select" name="subjects[]">

<option value="">Loading subjects...</option>

</select>

</td>

<td>

<select class="form-control" name="classes[]">

<option value="">-- Chagua Darasa --</option>
<option value="Form One">Form One</option>
<option value="Form Two">Form Two</option>
<option value="Form Three">Form Three</option>
<option value="Form Four">Form Four</option>

</select>

</td>

<td class="text-center">

<button type="button"
class="btn btn-success btn-sm"
onclick="addRow()">

+

</button>

</td>

</tr>

</tbody>

</table>

</div>

<div class="modal-footer">

<button type="submit" class="btn btn-primary">
💾 Hifadhi
</button>

<button type="button"
class="btn btn-secondary"
data-bs-dismiss="modal">

Funga

</button>

</div>

</div>

</form>

</div>
</div>

<script>

let subjectOptions = ""

function loadSubjects(){

fetch("/admin/get-all-subjects")

.then(res => res.json())

.then(data => {

subjectOptions = '<option value="">-- Chagua Somo --</option>'

data.subjects.forEach(sub => {

subjectOptions += `<option value="${sub}">${sub}</option>`

})

document.querySelectorAll(".subject-select").forEach(select => {

select.innerHTML = subjectOptions

})

})

}

function addRow(){

let table = document.getElementById("subjectTable").getElementsByTagName("tbody")[0]

let row = table.insertRow()

row.innerHTML = `

<td>

<select class="form-control subject-select" name="subjects[]">

${subjectOptions}

</select>

</td>

<td>

<select class="form-control" name="classes[]">

<option value="">-- Chagua Darasa --</option>
<option value="Form One">Form One</option>
<option value="Form Two">Form Two</option>
<option value="Form Three">Form Three</option>
<option value="Form Four">Form Four</option>

</select>

</td>

<td class="text-center">

<button type="button"
class="btn btn-danger btn-sm"
onclick="deleteRow(this)">
X
</button>

</td>

`

}

function deleteRow(btn){

btn.parentNode.parentNode.remove()

}

document.addEventListener("DOMContentLoaded", function(){

loadSubjects()

})

document.getElementById("addTeacherForm").addEventListener("submit", function(e){

let username = document.getElementById("teacherUsername").value.trim()

let names = username.split(" ")

if(names.length !== 3){

e.preventDefault()

alert("Username lazima iwe na majina matatu mfano: Juma Ali Said")

}

})

</script>
