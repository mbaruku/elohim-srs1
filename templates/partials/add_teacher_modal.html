<!-- Modal: Ongeza Mwalimu -->
<div class="modal fade" id="addTeacherModal" tabindex="-1">
<div class="modal-dialog modal-lg">

<form action="/admin/add-teacher" method="POST" id="addTeacherForm">

<div class="modal-content">

<div class="modal-header">
<h5 class="modal-title">➕ Ongeza Mwalimu</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">

<!-- Username -->
<div class="mb-3">
<label class="form-label">Jina la Mtumiaji</label>
<input type="text" class="form-control" name="username" id="teacherUsername" required>
<small class="text-muted">Majina matatu, la mwisho ndio password</small>
</div>

<!-- CLASS TEACHER -->
<div class="mb-3">
<label class="form-label">Darasa (ikiwa ni mwalimu wa darasa)</label>
<select class="form-control" name="class_level">
<option value="">-- Chagua Darasa --</option>
<option value="Form One">Form One</option>
<option value="Form Two">Form Two</option>
<option value="Form Three">Form Three</option>
<option value="Form Four">Form Four</option>
</select>
</div>

<div class="form-check mb-4">
<input class="form-check-input" type="checkbox" name="is_class_teacher">
<label class="form-check-label">Mwalimu wa Darasa</label>
</div>

<!-- COMBINATION -->
<div class="mb-3">
<label class="form-label">Combination (Form 3 & 4 tu)</label>
<select id="combination" class="form-control">
<option value="">-- Chagua Combination --</option>
<option value="Science">Science</option>
<option value="Art">Art</option>
</select>
</div>

<!-- SUBJECT TABLE -->
<label class="form-label">Masomo na Madarasa</label>

<table class="table table-bordered" id="subjectTable">

<thead class="table-light">
<tr>
<th>Somo</th>
<th>Darasa</th>
<th width="80">Action</th>
</tr>
</thead>

<tbody>

<tr>

<td>
<select class="form-control subject-select" name="subjects[]">
<option>Chagua darasa kwanza</option>
</select>
</td>

<td>
<select class="form-control class-select" name="classes[]">
<option value="">-- Chagua Darasa --</option>
<option value="Form One">Form One</option>
<option value="Form Two">Form Two</option>
<option value="Form Three">Form Three</option>
<option value="Form Four">Form Four</option>
</select>
</td>

<td class="text-center">
<button type="button" class="btn btn-success btn-sm" onclick="addRow()">+</button>
</td>

</tr>

</tbody>

</table>

</div>

<div class="modal-footer">
<button type="submit" class="btn btn-primary">💾 Hifadhi</button>
<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Funga</button>
</div>

</div>
</form>
</div>
</div>

<script>

function loadSubjects(classSelect, subjectSelect){

    let selectedClass = classSelect.value
    let combination = document.getElementById("combination").value

    if(!selectedClass){
        subjectSelect.innerHTML = '<option>Chagua darasa kwanza</option>'
        return
    }

    fetch(`/admin/get-subjects?class_level=${encodeURIComponent(selectedClass)}&combination=${encodeURIComponent(combination)}`)

    .then(res => res.json())
    .then(data => {

        let options = '<option value="">-- Chagua Somo --</option>'

        data.subjects.forEach(sub => {
            options += `<option value="${sub}">${sub}</option>`
        })

        subjectSelect.innerHTML = options

    })
}

function addRow(){

    let table = document.querySelector("#subjectTable tbody")

    let row = table.insertRow()

    row.innerHTML = `

    <td>
        <select class="form-control subject-select" name="subjects[]">
            <option>Chagua darasa kwanza</option>
        </select>
    </td>

    <td>
        <select class="form-control class-select" name="classes[]">
            <option value="">-- Chagua Darasa --</option>
            <option value="Form One">Form One</option>
            <option value="Form Two">Form Two</option>
            <option value="Form Three">Form Three</option>
            <option value="Form Four">Form Four</option>
        </select>
    </td>

    <td class="text-center">
        <button type="button" class="btn btn-danger btn-sm" onclick="deleteRow(this)">X</button>
    </td>

    `

}

function deleteRow(btn){
    btn.closest("tr").remove()
}

document.addEventListener("change", function(e){

    if(e.target.classList.contains("class-select")){
        let row = e.target.closest("tr")
        let subjectSelect = row.querySelector(".subject-select")

        loadSubjects(e.target, subjectSelect)
    }

})


// VALIDATION
document.getElementById("addTeacherForm").addEventListener("submit", function(e){

    let username = document.getElementById("teacherUsername").value.trim()
    let names = username.split(" ")

    if(names.length !== 3){
        e.preventDefault()
        alert("Username lazima iwe na majina matatu mfano: Juma Ali Said")
    }

})


document.getElementById("combination").addEventListener("change", function(){

    let rows = document.querySelectorAll("#subjectTable tbody tr")

    rows.forEach(row => {

        let classSelect = row.querySelector(".class-select")
        let subjectSelect = row.querySelector(".subject-select")

        if(classSelect.value){
            loadSubjects(classSelect, subjectSelect)
        }

    })

})

</script>
